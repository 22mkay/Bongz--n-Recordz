<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vault | Bongz 'n Recordz Braam</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>

    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-wrap">
                <img src="Bongz'NRecords.jpg" alt="Bongz 'n Recordz Logo" class="brand-logo">
                <h1 class="logo">Bongz 'n <span>Recordz</span></h1>
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="vault.html" style="color: var(--slime-green);">The Vault</a></li>
                    <li><a href="membership.html">Membership</a></li>
                    <li><a href="index.html#location">Find Us</a></li>
                    <li><a href="login.html" class="btn-slime btn-nav">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container hero-content">
            <h2>The Underground <span>Vault</span></h2>
            <p>Real-time inventory straight from our Braamfontein shelves. Log into your member portal to lock in a pickup order.</p>
        </div>
    </section>

    <section class="section-container">
        <div class="container">
            <h3>Live Menu & Stock Levels</h3>
            <div id="liveVaultGrid" class="grid-3"></div>
        </div>
    </section>

   
    <footer>
        <div class="container">
            <p>&copy; 2026 Bongz 'n Recordz. 18+ Only. Stay Elevated.</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        function renderVault() {
            const inventory = getInventory();
            const grid = document.getElementById("liveVaultGrid");
            grid.innerHTML = inventory.map(item => `
                <div class="card" style="border-top: 4px solid ${item.color};">
                    <div>
                        <h4>${item.name}</h4>
                        <p class="price">R${item.price} / ${item.unit}</p>
                        <p>${item.desc}</p>
                    </div>
                    <div>
                        <div style="background: rgba(34, 197, 94, 0.1); padding: 8px; border-radius: 6px; margin-bottom: 1rem;">
                            <span style="color: ${item.stock > 0 ? 'var(--slime-green)' : 'var(--rastas-red)'}; font-size: 0.9rem; font-weight: bold;">
                                ${item.stock > 0 ? `Stock Available: ${item.stock} ${item.unit}s left` : 'SOLD OUT'}
                            </span>
                        </div>
                        <a href="login.html" class="btn-slime" style="width:100%;">Login to Order Pickup</a>
                    </div>
                </div>
            `).join("");
        }

        window.addEventListener("storage", renderVault);
        renderVault();
    </script>
</body>
</html>
